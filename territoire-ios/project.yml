name: TMS
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  TMS:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
      - path: Core
    settings:
      base:
        # Identifier of the former TMS Impression app: Sideloadly replaces it instead of adding a second app.
        PRODUCT_BUNDLE_IDENTIFIER: fr.cteillet.tms.printerdiagnostic
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        GENERATE_INFOPLIST_FILE: "NO"
    dependencies:
      - sdk: ExternalAccessory.framework
      - sdk: WebKit.framework
schemes:
  TMS:
    build:
      targets:
        TMS: all
