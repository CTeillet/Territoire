# Configuration de la base de données PostgreSQL/PostGIS
spring.datasource.url=jdbc:postgresql://postgis:5432/territoire
spring.datasource.username=admin
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
waha.baseUrl=https://waha.cteillet.fr
waha.apiKey=${WAHA_API_KEY_PLAIN_TEXT}

# OpenTelemetry : export OTLP/HTTP vers le collector (réseau Docker interne)
management.opentelemetry.tracing.export.otlp.endpoint=http://collector:4318/v1/traces
management.opentelemetry.logging.export.otlp.endpoint=http://collector:4318/v1/logs
management.otlp.metrics.export.enabled=true
management.otlp.metrics.export.url=http://collector:4318/v1/metrics
management.opentelemetry.resource-attributes.deployment.environment.name=docker
