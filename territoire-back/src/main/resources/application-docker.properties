# Configuration de la base de données PostgreSQL/PostGIS
spring.datasource.url=jdbc:postgresql://postgis:5432/territoire
spring.datasource.username=admin
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
waha.baseUrl=https://waha.cteillet.fr
waha.apiKey=${WAHA_API_KEY_PLAIN_TEXT}

# Serveur SMTP du récapitulatif des retards (ex. Gmail : smtp.gmail.com, port 587, mot de passe d'application).
# MAIL_HOST vide : aucun e-mail n'est envoyé.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# OpenTelemetry : export OTLP/HTTP vers le collector (réseau Docker interne)
management.opentelemetry.tracing.export.otlp.endpoint=http://collector:4318/v1/traces
management.opentelemetry.logging.export.otlp.endpoint=http://collector:4318/v1/logs
management.otlp.metrics.export.enabled=true
management.otlp.metrics.export.url=http://collector:4318/v1/metrics
management.opentelemetry.resource-attributes.deployment.environment.name=docker
