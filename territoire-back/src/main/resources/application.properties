spring.application.name=territoire-back

# Port du serveur
server.port=8080

# Configuration de la base de données PostgreSQL/PostGIS
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuration Hibernate
spring.jpa.database=postgresql
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.hibernate.ddl-auto=update

# Flyway : sur la base de production existante, il se contente de la "baseliner" (création de la table flyway_schema_history,
# aucune donnée touchée) ; ensuite seules les migrations V2+ de db/migration sont appliquées.
# Hibernate (ddl-auto=update) continue d'ajouter les colonnes/tables manquantes.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.properties.hibernate.jdbc.use_streams_for_binary=true
spring.jpa.properties.hibernate.jdbc.batch_size=20

# Activer les logs SQL
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Sécurisation de l'API
jwt.secret=${JWT_SECRET_KEY}
# Jeton d'accès : 15 minutes (renouvelé automatiquement via le refresh token)
jwt.expiration=900000
# Refresh token : 30 jours sans utilisation (cookie HttpOnly, à usage unique : remplacé à chaque renouvellement)
jwt.refreshExpiration=2592000000
# Cookies Secure (HTTPS). Désactivé uniquement dans le profil local.
security.cookie.secure=true
# Anti-brute-force sur /connexion
security.login.max-failures-per-account=5
security.login.max-failures-per-ip=20
security.login.window-minutes=15
# Origines autorisées en CORS (séparées par des virgules)
cors.allowed-origins=https://tms.cteillet.fr

territoire.log-request-details=false

# Actuator : /actuator/health est public (sans détails), le reste est réservé au rôle ADMIN (cf. SecurityConfig)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.endpoint.prometheus.access=read_only
management.prometheus.metrics.export.enabled=true

# OpenTelemetry natif Spring Boot (sans agent Java) : traces, métriques et logs envoyés en OTLP/HTTP au collector.
# Les adresses du collector sont dans application-docker.properties : sans elles (local, tests), rien n'est exporté.
# Attention : les variables d'environnement OTEL_* sont lues par Spring Boot et priment sur ce fichier.
management.tracing.sampling.probability=1.0
management.otlp.metrics.export.enabled=false
# Durées en secondes (http_server_requests_seconds_* côté Prometheus) et seaux d'histogramme pour les percentiles
management.otlp.metrics.export.base-time-unit=seconds
management.otlp.metrics.export.step=30s
management.metrics.distribution.slo.http.server.requests=25ms,50ms,100ms,250ms,500ms,1s,2500ms,5s,10s
# Spans SQL (datasource-micrometer) : connexions et requêtes, sans le parcours des ResultSet
jdbc.includes=CONNECTION,QUERY

map.ign.layer=GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2
map.ign.wmtsBase=https://data.geopf.fr/wmts
map.ign.format=image/png
map.ign.style=normal
# Uploads : cartes de territoire (5 Mo max, cf. TerritoryService) et import Excel
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=8MB

# Liens personnels (espace « mes territoires »). Secret dédié recommandé : sans lui, il est dérivé de jwt.secret
access-link.secret=${ACCESS_LINK_SECRET:}
access-link.base-url=https://tms.cteillet.fr/m/
# Adresse de l'application (lien dans le message WhatsApp des demandes de territoire)
territoire.app-url=https://tms.cteillet.fr

# Récapitulatif des territoires en retard envoyé par e-mail chaque lundi à 8 h (heure de Paris), après les traitements de nuit.
# Sans serveur SMTP (spring.mail.host, cf. application-docker.properties), rien n'est envoyé.
territoire.late-report.cron=0 0 8 * * MON
# Adresse de l'expéditeur (vide : le compte SMTP, spring.mail.username)
territoire.mail.from=${MAIL_FROM:}
# Pas de connexion au serveur SMTP à chaque /actuator/health
management.health.mail.enabled=false

waha.session=territoire