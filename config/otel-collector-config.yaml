receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  batch:

exporters:
  debug:
    verbosity: detailed
  otlp_grpc:
    endpoint: tempo:4317
    tls:
      insecure: true
  # Ingestion OTLP native de Loki (3.x) : service.name devient le label service_name, le corps du log est la ligne,
  # niveau, trace_id, span_id et attributs sont en métadonnées structurées (requêtes sans | json)
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
  prometheus:
    endpoint: "0.0.0.0:8889"


extensions:
  health_check:
  pprof:
  zpages:

service:
  extensions: [health_check, pprof, zpages]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_grpc]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [ batch ]
      exporters: [otlp_http/loki]
