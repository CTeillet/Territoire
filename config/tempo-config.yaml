# Tempo 3.x en mode monolithique (sans Kafka). Les blocs ingester/compactor, le processeur local-blocks
# et metrics_generator.traces_storage de Tempo 2.x n'existent plus : Tempo refuse de démarrer s'ils sont présents.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        # Par défaut Tempo n'écoute que sur localhost : le collector doit pouvoir le joindre
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

# Rétention des traces : appliquée par le backend worker depuis Tempo 3 (remplace compactor.compaction.block_retention)
backend_worker:
  compaction:
    block_retention: 1h

metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: docker-compose
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
      generate_native_histograms: both
