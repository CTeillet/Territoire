name: CI - Automated Quality & Tests

on:
  pull_request:
    branches:
      - master
      - main
  push:
    branches:
      - master
      - main

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    outputs:
      back: ${{ steps.filter.outputs.back }}
      front: ${{ steps.filter.outputs.front }}
      backup: ${{ steps.filter.outputs.backup }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Filter Paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            back:
              - 'territoire-back/**'
              - '.github/workflows/ci.yml'
            front:
              - 'territoire-front/**'
              - '.github/workflows/ci.yml'
            backup:
              - 'config/backup/**'
              - 'docker-compose.yml'
              - '.github/workflows/ci.yml'

  frontend:
    name: Frontend (Lint & Tests)
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ needs.changes.outputs.front == 'true' || github.event_name == 'pull_request' }}
    defaults:
      run:
        working-directory: ./territoire-front

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: './territoire-front/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

      - name: Check Code Formatting (Prettier)
        run: npm run format:check

      - name: Run Unit & Component Tests with Coverage
        run: npm run test:coverage

      # Même commande que l'image Docker du déploiement : détecte dès la PR les erreurs propres au build
      # (bundling, pré-rendu des pages statiques, script prebuild) que tsc, ESLint et Vitest ne voient pas
      - name: Build Production Bundle (next build)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Upload Frontend Coverage Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-coverage-report
          path: territoire-front/coverage/
          if-no-files-found: ignore

  backend:
    name: Backend (Compilation & Tests)
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ needs.changes.outputs.back == 'true' || github.event_name == 'pull_request' }}
    defaults:
      run:
        working-directory: ./territoire-back

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Grant Execute Permission for Maven Wrapper
        run: chmod +x mvnw

      - name: Run Backend Tests with JaCoCo Coverage
        run: ./mvnw clean test

      - name: Upload Backend JaCoCo Coverage Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-jacoco-report
          path: territoire-back/target/site/jacoco/
          if-no-files-found: ignore

  # Sauvegarde puis restauration de bout en bout, avec le service db-backup de docker-compose.yml
  # et la procédure de restauration du README, sur une base PostGIS jetable
  backup:
    name: Backup BDD (sauvegarde & restauration)
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ needs.changes.outputs.backup == 'true' }}
    env:
      # Valeurs de test pour la base jetable du runner
      POSTGRES_PASSWORD: ci-secret
      SPRING_DATASOURCE_PASSWORD: ci-secret
      # Remote rclone "local" : les sauvegardes arrivent dans ./backups
      BACKUP_REMOTE: ci:/backups

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Build Backup Image
        run: docker compose build db-backup

      - name: Start PostGIS and Seed Test Data
        run: |
          docker compose up -d postgis
          # TCP uniquement : le serveur temporaire de l'initialisation n'écoute que sur le socket local
          for i in $(seq 60); do
            docker compose exec -T postgis pg_isready -q -h 127.0.0.1 -U admin -d territoire && break
            sleep 2
          done
          docker compose exec -T postgis psql -U admin -d territoire -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE test_territoire (id bigserial PRIMARY KEY, nom text NOT NULL, contour geometry(Polygon, 4326));
          INSERT INTO test_territoire (nom, contour)
          SELECT 'Territoire ' || i || ' é', ST_Buffer(ST_SetSRID(ST_MakePoint(2.3 + i / 100.0, 48.8), 4326), 0.01)::geometry(Polygon, 4326)
          FROM generate_series(1, 50) AS i;
          SQL

      - name: Prepare Remote, Key and Old Backups
        run: |
          mkdir -p rclone restauration backups/daily
          printf '[ci]\ntype = local\n' > rclone/rclone.conf
          docker compose run --rm -T --no-deps -v "$PWD/restauration:/restauration" db-backup age-keygen -o /restauration/cle.txt
          # Via un fichier : la sortie de "docker compose run" contient aussi la progression du build (pull_policy: build)
          docker compose run --rm -T --no-deps -v "$PWD/restauration:/restauration" db-backup \
            sh -c 'age-keygen -y /restauration/cle.txt > /restauration/cle.pub'
          grep -qx 'age1[0-9a-z]*' restauration/cle.pub
          echo "BACKUP_AGE_RECIPIENT=$(cat restauration/cle.pub)" >> "$GITHUB_ENV"
          # Rotation : l'ancienne sauvegarde doit disparaître, le reste être conservé
          touch -d '40 days ago' backups/daily/territoire_2000-01-01T0200Z.dump.age backups/daily/autre-fichier.txt
          touch -d '2 days ago' backups/daily/territoire_recente.dump.age

      - name: Run Backup
        run: |
          docker compose run --rm -T -v "$PWD/backups:/backups" db-backup run
          docker compose run --rm -T -v "$PWD/backups:/backups" db-backup list
          test ! -e backups/daily/territoire_2000-01-01T0200Z.dump.age
          test -e backups/daily/autre-fichier.txt
          test -e backups/daily/territoire_recente.dump.age
          ls backups/daily/territoire_"$(date -u +%Y-%m-%d)"T*.dump.age
          test -s backups/monthly/territoire_"$(date -u +%Y-%m)".dump.age

      - name: Restore as Documented and Compare
        run: |
          file=$(cd backups/daily && ls territoire_"$(date -u +%Y-%m-%d)"T*.dump.age | tail -n 1)
          docker compose run --rm -T -v "$PWD/backups:/backups" -v "$PWD/restauration:/restauration" db-backup fetch "daily/$file"
          docker compose stop territoire-back postgres-exporter db-backup
          docker compose exec -T postgis psql -U admin -d postgres -v ON_ERROR_STOP=1 \
            -c 'ALTER DATABASE territoire RENAME TO territoire_avant_restauration' \
            -c 'CREATE DATABASE territoire TEMPLATE template_postgis'
          docker compose run --rm -T --no-deps -v "$PWD/restauration:/restauration" db-backup \
            pg_restore --no-owner --exit-on-error --single-transaction --schema=public --dbname=territoire /restauration/territoire.dump
          # Schéma et données de l'application identiques (hors lignes \restrict, aléatoires à chaque dump)
          for db in territoire_avant_restauration territoire; do
            docker compose exec -T postgis pg_dump -U admin --no-owner --schema=public "$db" | grep -vE '^\\(un)?restrict ' > "$db.sql"
          done
          diff territoire_avant_restauration.sql territoire.sql
          grep -q 'Territoire 50 é' territoire.sql
