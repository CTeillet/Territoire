name: CI - Automated Quality & Tests

on:
  pull_request:
    branches:
      - master
      - main
  push:
    branches:
      - master
      - main

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      back: ${{ steps.filter.outputs.back }}
      front: ${{ steps.filter.outputs.front }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Filter Paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            back:
              - 'territoire-back/**'
              - '.github/workflows/ci.yml'
            front:
              - 'territoire-front/**'
              - '.github/workflows/ci.yml'

  frontend:
    name: Frontend (Lint & Tests)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.front == 'true' || github.event_name == 'pull_request' }}
    defaults:
      run:
        working-directory: ./territoire-front

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './territoire-front/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

      - name: Check Code Formatting (Prettier)
        run: npm run format:check

      - name: Run Unit & Component Tests with Coverage
        run: npm run test:coverage

      - name: Upload Frontend Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage-report
          path: territoire-front/coverage/
          if-no-files-found: ignore

  backend:
    name: Backend (Compilation & Tests)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.back == 'true' || github.event_name == 'pull_request' }}
    defaults:
      run:
        working-directory: ./territoire-back

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Grant Execute Permission for Maven Wrapper
        run: chmod +x mvnw

      - name: Run Backend Tests with JaCoCo Coverage
        run: ./mvnw clean test

      - name: Upload Backend JaCoCo Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-jacoco-report
          path: territoire-back/target/site/jacoco/
          if-no-files-found: ignore
