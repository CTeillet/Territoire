name: Build and Deploy

on:
  workflow_run:
    workflows: ["CI - Automated Quality & Tests"]
    types: [completed]
    branches:
      - master

permissions:
  packages: write
  contents: read

# Un seul déploiement à la fois, dans l'ordre (sans annuler celui en cours)
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    outputs:
      back: ${{ steps.filter.outputs.back }}
      front: ${{ steps.filter.outputs.front }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      - name: Filter paths
        id: filter
        run: |
          if git rev-parse --verify -q HEAD~1 > /dev/null; then
            files=$(git diff --name-only HEAD~1 HEAD)
          else
            files=$(git ls-tree -r --name-only HEAD)
          fi
          echo "$files"
          if echo "$files" | grep -q '^territoire-back/'; then echo "back=true" >> "$GITHUB_OUTPUT"; else echo "back=false" >> "$GITHUB_OUTPUT"; fi
          if echo "$files" | grep -q '^territoire-front/'; then echo "front=true" >> "$GITHUB_OUTPUT"; else echo "front=false" >> "$GITHUB_OUTPUT"; fi

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-24.04
    needs: changes

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GitHub Container Registry
        if: ${{ needs.changes.outputs.back == 'true' || needs.changes.outputs.front == 'true' }}
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and Push Backend Image
        if: ${{ needs.changes.outputs.back == 'true' }}
        run: |
          # Tag SHA en plus de latest : permet de revenir à une version précise (rollback)
          docker build -t ghcr.io/cteillet/territoire-back:latest -t ghcr.io/cteillet/territoire-back:${{ github.event.workflow_run.head_sha }} ./territoire-back
          docker push ghcr.io/cteillet/territoire-back:latest
          docker push ghcr.io/cteillet/territoire-back:${{ github.event.workflow_run.head_sha }}

      - name: Build and Push Frontend Image
        if: ${{ needs.changes.outputs.front == 'true' }}
        run: |
          docker build -t ghcr.io/cteillet/territoire-front:latest -t ghcr.io/cteillet/territoire-front:${{ github.event.workflow_run.head_sha }} ./territoire-front
          docker push ghcr.io/cteillet/territoire-front:latest
          docker push ghcr.io/cteillet/territoire-front:${{ github.event.workflow_run.head_sha }}

  deploy:
    name: Deploy to VPS
    needs: [changes, build-and-push]
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Copy docker-compose.yml to VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_ID }}
          password: ${{ secrets.VPS_SSH_PASSWORD }}
          source: "docker-compose.yml"
          target: "/home/${{ secrets.VPS_SSH_ID }}/territoire/"

      - name: Connect to VPS and remove older config folder
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_ID }}
          password: ${{ secrets.VPS_SSH_PASSWORD }}
          script: |
            rm -rf /home/${{ secrets.VPS_SSH_ID }}/territoire/config

      - name: Copy config folder to VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_ID }}
          password: ${{ secrets.VPS_SSH_PASSWORD }}
          source: "config"
          target: "/home/${{ secrets.VPS_SSH_ID }}/territoire/"

      - name: Connect to VPS and Deploy
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_ID }}
          password: ${{ secrets.VPS_SSH_PASSWORD }}
          script: |
            if [ "${{ needs.changes.outputs.back }}" = "true" ] || [ "${{ needs.changes.outputs.front }}" = "true" ]; then
              echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u cteillet --password-stdin
            fi
            if [ "${{ needs.changes.outputs.back }}" = "true" ]; then
              docker pull ghcr.io/cteillet/territoire-back:latest
            fi
            if [ "${{ needs.changes.outputs.front }}" = "true" ]; then
              docker pull ghcr.io/cteillet/territoire-front:latest
            fi
            cd /home/${{ secrets.VPS_SSH_ID }}/territoire
            docker compose up -d --force-recreate

      - name: Clean up old Docker images
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_ID }}
          password: ${{ secrets.VPS_SSH_PASSWORD }}
          script: |
            # Uniquement les images orphelines : les images taguées (SHA) restent disponibles pour un rollback
            docker image prune -f
