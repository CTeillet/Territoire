name: Build and Deploy

on:
  workflow_run:
    workflows: ["CI - Automated Quality & Tests"]
    types: [completed]
    branches:
      - master
  # Déploiement manuel depuis l'onglet Actions (sur master) : redéploie la dernière version de master
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Reconstruire les images même si elles existent déjà (ex. pour les correctifs des images de base)"
        type: boolean
        default: false

permissions:
  packages: write
  contents: read

# Un seul déploiement à la fois, sans annuler celui en cours. Un run en attente remplacé par le suivant ne perd rien :
# chaque run déploie l'état complet de master, pas seulement les changements de son commit.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  version:
    name: Detect versions
    runs-on: ubuntu-24.04
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    outputs:
      deploy: ${{ steps.version.outputs.deploy }}
      sha: ${{ steps.version.outputs.sha }}
      back: ${{ steps.version.outputs.back }}
      front: ${{ steps.version.outputs.front }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Historique complet : le tag d'une image est le dernier commit qui a modifié son dossier
          fetch-depth: 0

      - name: Compute Image Tags
        id: version
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          # Les CI ne finissent pas dans l'ordre des merges : un commit qui n'est plus le dernier de master
          # remettrait en production une version plus ancienne. Le run d'un commit plus récent déploiera tout.
          master=$(git ls-remote origin refs/heads/master | cut -f1)
          if [ "$sha" != "$master" ]; then
            echo "::notice::$sha n'est plus le dernier commit de master ($master) : déploiement ignoré"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"
          # Une image ne dépend que de son dossier : même contenu, même tag, quel que soit le commit déployé
          echo "back=$(git log -1 --format=%H -- territoire-back)" >> "$GITHUB_OUTPUT"
          echo "front=$(git log -1 --format=%H -- territoire-front)" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-24.04
    needs: version
    if: ${{ needs.version.outputs.deploy == 'true' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Seules les images absentes de GHCR sont construites : un changement jamais déployé (CI en échec,
      # run remplacé) est rattrapé par le déploiement suivant
      - name: Build and Push Missing Images
        env:
          REBUILD: ${{ inputs.rebuild == true }}
        run: |
          build() {
            image="ghcr.io/cteillet/$1:$2"
            if [ "$REBUILD" != true ] && docker manifest inspect "$image" > /dev/null 2>&1; then
              echo "$image existe déjà"
              return
            fi
            docker build -t "$image" "./$1"
            docker push "$image"
          }
          build territoire-back "${{ needs.version.outputs.back }}"
          build territoire-front "${{ needs.version.outputs.front }}"

  deploy:
    name: Deploy to VPS
    needs: [version, build-and-push]
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}

      # Dossier d'attente vidé à chaque fois ; deploy/deploy.sh en met le contenu en place
      - name: Copy Compose, Config and Deploy Script to VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_ID }}
          password: ${{ secrets.VPS_SSH_PASSWORD }}
          source: "docker-compose.yml,config,deploy/deploy.sh"
          target: "/home/${{ secrets.VPS_SSH_ID }}/territoire/.deploy"
          rm: true

      - name: Deploy, Check Health and Roll Back on Failure
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_ID }}
          password: ${{ secrets.VPS_SSH_PASSWORD }}
          command_timeout: 15m
          script: |
            set -e
            cd /home/${{ secrets.VPS_SSH_ID }}/territoire
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u cteillet --password-stdin
            bash .deploy/deploy/deploy.sh "${{ needs.version.outputs.back }}" "${{ needs.version.outputs.front }}"

      # Sur GHCR aussi, latest désigne la version en production (docker compose pull sur le VPS)
      - name: Tag Deployed Images as latest
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker buildx imagetools create -t ghcr.io/cteillet/territoire-back:latest "ghcr.io/cteillet/territoire-back:${{ needs.version.outputs.back }}"
          docker buildx imagetools create -t ghcr.io/cteillet/territoire-front:latest "ghcr.io/cteillet/territoire-front:${{ needs.version.outputs.front }}"
