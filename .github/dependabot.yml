version: 2
updates:
  - package-ecosystem: maven
    directory: /territoire-back
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /territoire-front
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint (utilisé par eslint-config-next) n'accepte que typescript <6.1.0 :
      # retirer cette règle quand une version de typescript-eslint acceptera TypeScript 6.1+
      - dependency-name: typescript
        versions: [">=6.1.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /territoire-back
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /territoire-front
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /config/backup
    schedule:
      interval: monthly
