services:
  postgis:
    # Version majeure figée : un serveur 18 refuse de démarrer sur les données d'un 17 (et PGDATA change en 18).
    # À monter volontairement, avec migration des données et l'image de sauvegarde (config/backup/Dockerfile).
    image: postgis/postgis:17-3.5
    container_name: postgis_container
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: territoire
    ports:
      # Accessible uniquement depuis le VPS (tunnel SSH pour un accès distant)
      - "127.0.0.1:5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data

  # Sauvegarde quotidienne chiffrée de la base vers un stockage externe (README > Sauvegardes)
  db-backup:
    build: ./config/backup
    # Reconstruite (depuis le cache) à chaque déploiement : prend en compte les changements de config/backup
    pull_policy: build
    restart: always
    init: true
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    depends_on:
      - postgis
    environment:
      PGHOST: postgis
      PGUSER: admin
      PGDATABASE: territoire
      # Mot de passe déjà utilisé par le back pour le même utilisateur admin
      PGPASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      RCLONE_CONFIG: /config/rclone/rclone.conf
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_HEALTHCHECK_URL: ${BACKUP_HEALTHCHECK_URL:-}
      # Facultatifs, valeurs par défaut dans config/backup/db-backup.sh
      BACKUP_TIME: ${BACKUP_TIME:-}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-}
      BACKUP_MONTHLY_RETENTION_DAYS: ${BACKUP_MONTHLY_RETENTION_DAYS:-}
    volumes:
      # Hors de config/ : ce dossier est supprimé puis recopié à chaque déploiement
      - ./rclone:/config/rclone

  territoire-back:
    image: ghcr.io/cteillet/territoire-back:latest
    container_name: territoire-back
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    depends_on:
      - postgis
    environment:
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      WAHA_API_KEY_PLAIN_TEXT: ${WAHA_API_KEY_PLAIN_TEXT}
      # Clé des liens personnels (/m/...). Facultative : sans elle, dérivée de JWT_SECRET_KEY (changer la clé JWT invaliderait alors les liens)
      ACCESS_LINK_SECRET: ${ACCESS_LINK_SECRET:-}
      # Serveur SMTP du récapitulatif hebdomadaire des retards. Facultatif : sans MAIL_HOST, aucun e-mail n'est envoyé
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
    ports:
      - "127.0.0.1:8080:8080"


  territoire-front:
    image: ghcr.io/cteillet/territoire-front:latest
    container_name: territoire-front
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    depends_on:
      - territoire-back
    environment:
      NEXT_PUBLIC_API_URL: http://territoire-back:8080
      # Traces du serveur Next.js (instrumentation.ts) vers le collector
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
    ports:
      # Derrière le reverse proxy du VPS : pas d'accès direct depuis Internet (Docker contourne ufw)
      - "127.0.0.1:3000:3000"

  # Observabilité : versions figées et à monter volontairement (les montées majeures changent la config, ex. Tempo 3)
  collector:
    image: otel/opentelemetry-collector-contrib:0.98.0
    volumes:
      - ./config/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    # Aucun port publié : le backend et le front (OTLP/HTTP http://collector:4318) et Prometheus (collector:8889)
    # y accèdent par le réseau Docker interne.

  grafana:
    image: grafana/grafana:13.2.4
    ports:
      - "127.0.0.1:4000:3000"
    volumes:
      - ./config/grafana:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SERVER_DOMAIN=grafana-tms.cteillet.fr
      - GF_SERVER_ROOT_URL=https://grafana-tms.cteillet.fr
      - GF_SERVER_ENFORCE_DOMAIN=true
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      # sécurité
      - GF_SECURITY_COOKIE_SECURE=true
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASS}

  tempo:
    image: grafana/tempo:3.0.4
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./config/tempo-config.yaml:/etc/tempo.yaml
      - tempo_data:/var/tempo
    # Pas de port publié : Grafana et le collector y accèdent par le réseau Docker interne

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus.yaml
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
      - --enable-feature=native-histograms
    volumes:
      - ./config/prometheus-config.yaml:/etc/prometheus.yaml
    # Pas de port publié (accès via Grafana)

  loki:
    image: grafana/loki:3.7.8
    # Pas de port publié (accès via Grafana)
    command: -config.file=/etc/loki-config.yaml
    volumes:
      - ./config/loki-config.yaml:/etc/loki-config.yaml

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_URI: "postgis:5432/territoire?sslmode=disable"
      DATA_SOURCE_USER: "admin"
      DATA_SOURCE_PASS: ${PG_ADMIN_PASSWORD}
    # Pas de port publié (scrappé par Prometheus sur le réseau interne)

volumes:
  postgis_data:
  grafana_data:
  tempo_data:
